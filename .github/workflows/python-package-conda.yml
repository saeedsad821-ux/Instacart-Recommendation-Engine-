name: Python Package CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy lightgbm scikit-learn pytest

    - name: Setup Mock Data for Tests
      run: |
        mkdir -p data/processed
        python -c "import pandas as pd; pd.DataFrame({'user_id':[1],'eval_set':['train'],'product_id':[100],'is_ordered_history':['0 1'],'order_number_history':['1 2'],'days_since_prior_order_history':['0.0 7.0'],'aisle_id':[1],'department_id':[1]}).to_csv('data/processed/product_data.csv', index=False)"

    - name: Run Project Health Check
      run: |
        python tests/project_health_check.py

    - name: Run Full Isolation Test
      run: |
        python tests/full_isolation_test.py
